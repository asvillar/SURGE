- key: plasma.constellaration_multioutput
  status: ready
  status_note: "90→8 equilibrium metrics; run 2026-09-25 mean R² 0.916, QI 0.935"
  name: ConStellaration Joint Multi-output
  capability: Scientific Domain
  tier: 2
  citation: Cadena et al. (2025) arXiv:2506.19583 — single 90→8 surrogate
  url: https://arxiv.org/abs/2506.19583
  shape: 90 → 8
  n: 26,897
  primary_metric: R² (mean, 8 equilibrium metrics)
  threshold: equilibrium mean R² ≥ 0.85
  threshold_note: 'Trains and scores only the 8 metrics that require the VMEC++
    equilibrium solve (test_r2_equilibrium_mean gates the pass/fail). The other
    4 ConStellaration labels are not trained at all: aspect_ratio, max_elongation
    and average_triangularity are computed in closed form from the boundary
    coefficients (surge.benchmarks.loaders.constellaration.geometry_metrics,
    machine precision) and aspect_ratio_over_edge_rotational_transform follows
    by dividing that exact aspect_ratio by the (learned) edge ι/n_fp — there is
    no longer a geometry-sanity row in the gate. Also logged: RMSE, min/max
    per-metric R², NRMSE. HPO: surge run -b constellaration_multi -m
    pytorch.residual_mlp --hpo'
  description: Single joint surrogate predicting the 8 equilibrium-solve stellarator
    metrics from boundary shape (alternative to the paper’s 12-model protocol).
  io_note: 'Joint multi-output benchmark (not the paper’s 12-model protocol), trained
    on equilibrium targets only. Workflow: examples/constellaration_multioutput_workflow.py'
  inputs:
  - name: r_cos[0:44]
    desc: 45 R Fourier cos coefficients (VMEC boundary)
  - name: z_sin[0:44]
    desc: 45 Z Fourier sin coefficients (VMEC boundary)
  outputs:
  - name: axis_rotational_transform_over_n_field_periods
    desc: Axis ι / n_fp
    kind: equilibrium
  - name: edge_rotational_transform_over_n_field_periods
    desc: Edge ι / n_fp
    kind: equilibrium
  - name: axis_magnetic_mirror_ratio
    desc: Axis magnetic mirror ratio
    kind: equilibrium
  - name: edge_magnetic_mirror_ratio
    desc: Edge magnetic mirror ratio
    kind: equilibrium
  - name: vacuum_well
    desc: Vacuum magnetic well
    kind: equilibrium
  - name: minimum_normalized_magnetic_gradient_scale_length
    desc: Min normalised |∇B| scale length
    kind: equilibrium
  - name: flux_compression_in_regions_of_bad_curvature
    desc: Flux compression in bad-curvature regions
    kind: equilibrium
  - name: log_10_qi
    desc: log₁₀ quasi-isodynamic quality (lower = better QI)
    kind: equilibrium
- key: plasma.constellaration_modb
  status: in_progress
  status_note: "field surrogates; 500/26,897 equilibria cached"
  name: ConStellaration |B| Field Surrogate
  capability: Scientific Domain
  tier: 2
  citation: Cadena et al. (2025) arXiv:2506.19583; VMEC — Hirshman & Whitson (1983) Phys.
    Fluids 26, 3553
  url: https://arxiv.org/abs/2506.19583
  shape: 2×64×32 → 64×32
  n: 500 (of 26,897; grows as the wout download completes)
  primary_metric: rel-L2 (median)
  threshold: rel-L2 ≤ 0.05
  threshold_note: PROVISIONAL — set from the first full-cache leaderboard (not yet run);
    today's 500-row cache is a smoke test only.
  description: 'Boundary shape → |B|(θ,φ) on the last closed flux surface: predict the
    field-strength map on the plasma boundary from the same 90 boundary Fourier coefficients
    as the scalar ConStellaration benchmarks.'
  io_note: 'X derived via boundary_grid (theta_ref gauge); y from the wout bmnc via evaluate_modB,
    re-expressed on the same grid (theta_ref = pi - theta_wout, an exact index permutation
    for even n_theta) and normalised by its per-sample mean. Also reports test_relative_l2_mean
    and test_mirror_ratio_mae; extra carries mean-field and POD+ridge baselines. Requires
    the downloaded VMEC wout subset (surge.benchmarks.loaders.constellaration.download_wout_subset).'
  inputs:
  - name: boundary_RZ
    desc: Boundary (R, Z) on a 64×32 (θ,φ) grid, from the 90 r_cos/z_sin coefficients
  outputs:
  - name: modB
    desc: '|B|(θ,φ) on the LCFS, normalised by its per-sample mean'
    kind: equilibrium
- key: plasma.constellaration_surfaces
  status: in_progress
  status_note: "field surrogates; 500/26,897 equilibria cached"
  name: ConStellaration Flux-Surface Field Surrogate
  capability: Scientific Domain
  tier: 2
  citation: Cadena et al. (2025) arXiv:2506.19583; VMEC — Hirshman & Whitson (1983) Phys.
    Fluids 26, 3553
  url: https://arxiv.org/abs/2506.19583
  shape: 2×64×32 → 2×16×64
  n: 500 (of 26,897; grows as the wout download completes)
  primary_metric: rel-L2 (median)
  threshold: rel-L2 ≤ 0.02
  threshold_note: PROVISIONAL — set from the first full-cache leaderboard (not yet run).
  description: 'Boundary shape → poloidal cross-sections of the 16 stored flux surfaces
    at φ=0: the stellarator analogue of a tokamak ψ-map.'
  io_note: 'Same X as plasma.constellaration_modb; y = R(θ),Z(θ) per surface (surface 0 =
    magnetic axis, last = boundary) from the wout rmnc/zmns via evaluate_surface, re-expressed
    on the theta_ref grid. Also reports test_relative_l2_mean and test_axis_position_error
    (surface-0 centroid displacement / minor radius); extra carries mean-field and POD+ridge
    baselines. Same wout-subset requirement and canonical split as constellaration_modb.'
  inputs:
  - name: boundary_RZ
    desc: Boundary (R, Z) on a 64×32 (θ,φ) grid, from the 90 r_cos/z_sin coefficients
  outputs:
  - name: surfaces_RZ
    desc: R(θ), Z(θ) at φ=0 for each of the 16 stored flux surfaces
    kind: equilibrium
- key: plasma.qlknn10d
  status: needs_rerun
  status_note: "strongest result, R² 0.989 in examples/qlknn10d_study.py, no result.json via surge bench yet"
  name: QLKNN10D QuaLiKiz Training Data
  capability: Scientific Domain
  tier: 2
  citation: van de Plassche et al. (2020) Phys. Plasmas 27, 022310 — QLKNN10D, Zenodo 10.5281/zenodo.3497066
  url: https://zenodo.org/records/3497066
  shape: 9 → 1
  n: 2.4M / 290M
  primary_metric: R²
  threshold: R² ≥ 0.95
  threshold_note: paper-quality gate for the ITG leading flux on unstable points; subset documented in the loader.
  description: 'Reproduce QLKNN from its own public training data: predict the QuaLiKiz ITG ion heat flux from 9 gyrokinetic parameters.'
  inputs:
  - {name: Zeff, desc: Effective charge}
  - {name: Ati, desc: Normalised ion temperature gradient}
  - {name: Ate, desc: Normalised electron temperature gradient}
  - {name: An, desc: Normalised density gradient (electrons = ions)}
  - {name: q, desc: Safety factor}
  - {name: smag, desc: Magnetic shear}
  - {name: x, desc: Normalised minor radius}
  - {name: Ti_Te, desc: Ion-to-electron temperature ratio}
  - {name: Nustar, desc: Collisionality}
  outputs:
  - {name: efiITG, desc: ITG ion heat flux (leading flux, GyroBohm units)}
- key: plasma.qlknn_transport
  status: tutorial
  status_note: "ground truth is the QLKNN_7_11 network itself"
  name: QLKNN Turbulent Transport Coefficient
  capability: Scientific Domain
  tier: 2
  citation: van de Plassche et al. (2020) Phys. Plasmas — QuaLiKiz surrogate
  url: https://doi.org/10.1063/1.5134126
  shape: 10 → 1
  n: 7,475
  primary_metric: R²
  threshold: R² ≥ 0.90
  description: 'Emulate QLKNN/QuaLiKiz turbulent transport: predict electron ITG heat flux
    from normalised gyrokinetic parameters.'
  io_note: Ground truth is the QLKNN_7_11 surrogate (fusion_surrogates); SURGE models emulate
    that mapping. Only samples with active ITG transport (efeITG > 0) are kept.
  inputs:
  - name: Ati
    desc: Normalised ion temperature gradient
  - name: Ate
    desc: Normalised electron temperature gradient
  - name: Ane
    desc: Normalised electron density gradient
  - name: Ani
    desc: Normalised ion density gradient
  - name: q
    desc: Safety factor
  - name: smag
    desc: Magnetic shear
  - name: x
    desc: Normalised minor radius
  - name: Ti_Te
    desc: Ion-to-electron temperature ratio
  - name: LogNuStar
    desc: Log collisionality
  - name: normni
    desc: Normalised ion density
  outputs:
  - name: efeITG
    desc: Electron heat flux from the ITG mode (gyroBohm-normalised units)
