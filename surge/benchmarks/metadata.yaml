# SURGE benchmark metadata — single source of truth for leaderboard
# reports (names, citations, tiers, thresholds, IO descriptions).
# Extracted 2026-07 from the retired canvas leaderboard and the
# benchmark verification brief by scripts/extract_benchmark_metadata.py.
# Edit THIS file to change benchmark descriptions; result numbers
# always come from benchmark_reports/**/result.json at render time.
benchmarks:
- key: tabular.california_housing
  status: ready
  status_note: "Real UCI/OpenML data (n ≥ 1,000 train+test) with real runs on file"
  name: California Housing
  capability: Scalar Regression
  discipline: Environmental Sciences
  tier: 1
  citation: Pace & Barry (1997) Statistics & Probability Letters
  url: https://doi.org/10.1016/S0167-7160(97)00010-0
  shape: 8 → 1
  n: 20,640
  primary_metric: R²
  threshold: R² ≥ 0.75
  description: Predict median house value in California census block groups from socioeconomic
    and geographic features (1990 US Census aggregates).
  task_explainer: "Eight census-block-group aggregates (income, house age, rooms, occupancy, population, latitude/longitude) are mapped to the block group's median house value. A good surrogate replaces a hedonic-pricing model of the 1990 California market. R² is the fraction of price variance explained on held-out blocks."
  published_in: "Pace & Barry, Stat. & Prob. Letters 33 (1997); distributed via scikit-learn / StatLib (CMU)"
  sota:
    value: null
    metric: "R²"
    model: null
    source: "BENCHMARK_SOTA_REVIEW (2026-09-24)"
    url: null
    protocol_match: "unknown"
    note: "no verified published number for this exact split/protocol; Pace & Barry OLS ~0.60, community gradient-boosting baselines ~0.83-0.85, no canonical paper number"
  inputs:
  - {name: "MedInc", desc: "Median block-group income (tens of k$)"}
  - {name: "HouseAge", desc: "Median house age (years)"}
  - {name: "AveRooms", desc: "Average rooms per household"}
  - {name: "AveBedrms", desc: "Average bedrooms per household"}
  - {name: "Population", desc: "Block-group population"}
  - {name: "AveOccup", desc: "Average household occupancy"}
  - {name: "Latitude", desc: "Block-group latitude (deg)"}
  - {name: "Longitude", desc: "Block-group longitude (deg)"}
  outputs:
  - {name: "MedHouseVal", desc: "Median house value (units of 100k$)"}
  visible: true
  focus: true
  focus_note: "Need more explanation. Can we understand better parameters / visualize further the predictions we are making? How does it compare with State of the art models? Where is this published?"
