[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surge-ml"
version = "0.1.0rc1"
description = "Surrogate modeling framework for scientific workflows: SciML, AutoML, UQ, and MLOps-style provenance in a declarative pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Álvaro Sánchez Villar" }]
keywords = ["surrogate", "machine learning", "scientific computing", "MLOps"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=1.20.0",
  "scipy>=1.5.0",
  "scikit-learn>=1.0.0",
  "joblib>=1.0.0",
  "pandas>=1.5.0",
  "pyarrow>=10.0.0",
  "pyyaml>=6.0.0",
  "matplotlib>=3.5.0",
  "optuna>=3.0.0",
  "scikit-optimize>=0.9.0",
]

[project.optional-dependencies]
torch = ["torch>=1.9.0"]
# ONNX export of torch models. onnxscript is the exporter backend that
# torch>=2.11 dispatches to when you call torch.onnx.export; without it
# the export silently skips. onnxruntime is the inference runtime used
# by the E2E smoke test to verify numeric parity. Installing the `onnx`
# extra gets you the full export → reload → parity path.
onnx = ["onnx>=1.14", "onnxscript>=0.1", "onnxruntime>=1.17"]
# TensorFlow/GPflow model families. Floors are the NumPy-2-compatible set
# documented in requirements.txt (mainline TF >= 2.21 everywhere,
# including Apple Silicon — tensorflow-macos is dead).
# gpflow itself is NOT listed: its published metadata pins numpy<2 (and
# tensorflow-macos on arm64), which is unresolvable next to TF >= 2.21,
# even though gpflow 2.11 runs fine on NumPy 2.x. This extra provides
# the full runtime stack including gpflow's pure-Python deps; finish with
#   pip install gpflow --no-deps
# (verified: TF 2.21 + GPflow 2.11.1 + NumPy 2.5). See GETTING_STARTED.
gpflow = [
  "tensorflow>=2.21", "tf-keras>=2.21", "tensorflow-probability>=0.25",
  "check_shapes>=1.0", "multipledispatch>=0.6", "deprecated>=1.2",
  "tabulate>=0.9",
]
tensorflow = ["tensorflow>=2.21", "tf-keras>=2.21"]
# SHAP feature importance; >=0.46 is the first NumPy-2-compatible release.
shap = ["shap>=0.46"]
# h5py is included so M3DC1 batch-mode tests run without an extra install.
mlflow = ["mlflow>=2.0.0"]
benchmarks = ["h5py>=3.0", "optuna>=3.0"]
tabpfn = ["tabpfn>=2.0"]
thewell = ["the-well"]
dev = ["pytest>=6.0", "pytest-cov", "ruff>=0.1.0", "h5py>=3.0"]
# Mirrors docs/requirements.txt (the ReadTheDocs build input); conf.py
# uses the RTD theme, not furo.
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=3.0",
        "sphinx-autodoc-typehints>=2.0", "sphinxcontrib-bibtex>=2.0",
        "numpydoc>=1.5"]

[project.scripts]
surge-benchmark = "surge.benchmarks.run:main"
surge = "surge.cli:main"

[project.urls]
Homepage = "https://github.com/S-Villar/SURGE"
Documentation = "https://github.com/S-Villar/SURGE/blob/main/docs/README.md"
Repository = "https://github.com/S-Villar/SURGE"
Issues = "https://github.com/S-Villar/SURGE/issues"

# Install the `surge` Python package from the `surge/` directory.
# Package name on PyPI is `surge-ml` to reduce clash with other projects named "surge".
[tool.setuptools.packages.find]
where = ["."]
include = ["surge*"]

# Non-Python files that must ship in wheels: the benchmark metadata
# (names, citations, tiers, thresholds) that reports read at runtime.
[tool.setuptools.package-data]
surge = ["benchmarks/metadata.yaml", "workflow/spec.schema.json"]

# Scope `pytest` to the actual test suite. Without this, `pytest -q` from the
# repo root walks into scripts/ and examples/ and trips over legacy tutorial
# scripts whose imports reference older SURGE APIs. CI passes because it
# invokes `pytest -q tests/` explicitly; this keeps local runs consistent.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
